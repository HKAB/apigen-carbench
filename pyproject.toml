[project]
name = "apigen"
version = "0.1.0"
description = "APIGen: automated pipeline for verifiable function-calling datasets (user-car domain)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
apigen = "apigen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apigen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
